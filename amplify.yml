version: 1
monorepo:
  applications:
    # ==== Frontend: Next.js (frontend/) ====
    - appRoot: frontend
      frontend:
        phases:
          preBuild:
            commands:
              - npm ci
          build:
            commands:
              - npm run build
        artifacts:
          baseDirectory: .next
          files:
            - "**/*"
        cache:
          paths:
            - node_modules/**/*
            - .next/cache/**/*
    # ==== Backend: Amplify Gen2 Backend (repo root) ====
    - appRoot: .
      backend:
        phases:
          preBuild:
            commands:
              - npm ci
          build:
            commands:
              - npx ampx generate outputs \
                --branch $AWS_BRANCH \
                --app-id $AWS_APP_ID
        cache:
          paths:
            - node_modules/**/*
