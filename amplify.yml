version: 1
monorepo:
  applications:
    - appRoot: frontend
      frontend:
        phases:
          preBuild:
            commands:
              - npm ci
          build:
            commands:
              - npm run build
        artifacts:
          baseDirectory: .next
          files:
            - "**/*"
        cache:
          paths:
            - node_modules/**/*
    - appRoot: .
      backend:
        phases:
          build:
            commands:
              - npx ampx generate outputs \
                --branch $AWS_BRANCH \
                --app-id $AWS_APP_ID
